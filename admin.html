<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - FreeSportsPicks.pro</title>
<meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#F8FAFC;color:#0F172A}
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center}
.lb{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:48px;width:100%;max-width:400px;text-align:center}
input[type=password]{width:100%;padding:12px 16px;border:1px solid #E2E8F0;border-radius:6px;font-size:14px;outline:none;margin-bottom:16px}
.bp{background:#0EA5E9;color:#fff;border:none;border-radius:6px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;width:100%}
.btn{padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.sc{background:#fff;border:1px solid #E2E8F0;border-radius:8px;padding:20px}
.sv{font-size:28px;font-weight:700;margin-bottom:4px}
.tw{background:#fff;border:1px solid #E2E8F0;border-radius:8px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:12px 14px;text-align:left;font-size:11px;font-weight:700;color:#64748B;text-transform:uppercase;background:#F8FAFC;border-bottom:1px solid #E2E8F0;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #F1F5F9;vertical-align:middle}
tr:nth-child(even){background:#FAFAFA}
.empty{padding:40px;text-align:center;color:#94A3B8}
.ab{padding:5px 10px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;border:none;margin:0 2px}
@media(max-width:768px){.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="lw" id="LW">
  <div class="lb">
    <div style="font-size:48px;margin-bottom:16px">&#128274;</div>
    <div style="font-size:22px;font-weight:700;margin-bottom:8px">Admin Panel</div>
    <div style="font-size:14px;color:#64748B;margin-bottom:24px">FreeSportsPicks.pro</div>
    <input type="password" id="PW" placeholder="Enter password" onkeydown="if(event.key==='Enter')LGN()">
    <button class="bp" onclick="LGN()">Access Admin</button>
  </div>
</div>
<div id="DW" style="display:none;padding:32px 20px;max-width:1400px;margin:0 auto">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px">
    <div>
      <div style="font-size:28px;font-weight:700">FreeSportsPicks Leads</div>
      <div style="font-size:14px;color:#64748B;margin-top:4px" id="TC">Loading...</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" style="background:#fff;border:1px solid #E2E8F0;color:#64748B" onclick="LOAD()">Refresh</button>
      <button class="btn" style="background:#0EA5E9;color:#fff" onclick="PALL()">Print All / Selected</button>
      <button class="btn" style="background:#EF4444;color:#fff;display:none" id="DSB" onclick="DSEL()">Delete Selected</button>
      <button class="btn" style="background:none;border:1px solid #E2E8F0;color:#64748B" onclick="LGT()">Logout</button>
    </div>
  </div>
  <div class="stats">
    <div class="sc"><div class="sv" id="S1" style="color:#0EA5E9">0</div><div style="font-size:13px;color:#64748B">Total Leads</div></div>
    <div class="sc"><div class="sv" id="S2" style="color:#10B981">0</div><div style="font-size:13px;color:#64748B">This Week</div></div>
    <div class="sc"><div class="sv" id="S3" style="color:#F59E0B">0</div><div style="font-size:13px;color:#64748B">Today</div></div>
    <div class="sc"><div class="sv" id="S4" style="color:#8B5CF6">0</div><div style="font-size:13px;color:#64748B">With Sport</div></div>
  </div>
  <div class="tw"><div style="overflow-x:auto"><table>
    <thead><tr>
      <th><input type="checkbox" id="CA" onchange="SALL(this.checked)"></th>
      <th>Date</th><th>Name</th><th>Email</th><th>City</th>
      <th>Sport</th><th>Source</th><th>Message</th><th>Actions</th>
    </tr></thead>
    <tbody id="TB"><tr><td colspan="9" class="empty">Loading...</td></tr></tbody>
  </table></div></div>
</div>
<script>
var PW="FreeSports2026!";
var SB="https://ehjhsbrcbtqcvmgzjzkm.supabase.co";
var SK="sb_secret_B9AG8VXwdsj5D5SK7Ebn6g_KRLgiHOZ";
var LD=[];
var SL=new Set();
function LGN(){
  var v=document.getElementById("PW").value;
  if(v===PW){
    document.getElementById("LW").style.display="none";
    document.getElementById("DW").style.display="block";
    LOAD();
  } else { alert("Wrong password"); }
}
function LGT(){
  document.getElementById("LW").style.display="flex";
  document.getElementById("DW").style.display="none";
  document.getElementById("PW").value="";
  LD=[];SL.clear();
}
function LOAD(){
  document.getElementById("TB").innerHTML="<tr><td colspan=9 class=empty>Loading...</td></tr>";
  fetch(SB+"/rest/v1/sportspicks_leads?select=*&order=created_at.desc",{
    headers:{"apikey":SK,"Authorization":"Bearer "+SK}
  }).then(function(r){return r.json();}).then(function(d){
    LD=Array.isArray(d)?d:[];
    STAT();REND();
  }).catch(function(e){
    document.getElementById("TB").innerHTML="<tr><td colspan=9 class=empty>Error: "+e.message+"</td></tr>";
  });
}
function STAT(){
  var now=new Date();
  var wk=new Date(now-7*24*60*60*1000);
  document.getElementById("S1").textContent=LD.length;
  document.getElementById("S2").textContent=LD.filter(function(l){return new Date(l.created_at)>wk;}).length;
  document.getElementById("S3").textContent=LD.filter(function(l){return new Date(l.created_at).toDateString()===now.toDateString();}).length;
  document.getElementById("S4").textContent=LD.filter(function(l){return l.favorite_sport;}).length;
  document.getElementById("TC").textContent=LD.length+" total leads";
}
function ESC(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function REND(){
  var tb=document.getElementById("TB");
  if(!LD.length){tb.innerHTML="<tr><td colspan=9 class=empty>No leads yet.</td></tr>";return;}
  var h="";
  for(var i=0;i<LD.length;i++){
    var l=LD[i];
    var id=l.id;
    var dt=new Date(l.created_at).toLocaleDateString();
    var sp=ESC(l.favorite_sport||"-");
    var sr=ESC(l.source||"-");
    var ms=ESC(l.message||"-");
    var nm=ESC(l.name||"-");
    var em=l.email||"";
    var cy=ESC(l.city||"-");
    var bg=SL.has(id)?"background:#EFF6FF":"";
    var ck=SL.has(id)?"checked":"";
    h+="<tr id=R"+id+" style='"+bg+"'>";
    h+="<td><input type=checkbox "+ck+" onchange='TOG(\""+id+"\",this.checked)'></td>";
    h+="<td style='white-space:nowrap;color:#64748B'>"+dt+"</td>";
    h+="<td style='font-weight:600'>"+nm+"</td>";
    h+="<td>"+(em?"<a href='mailto:"+em+"' style='color:#0EA5E9;text-decoration:none'>"+ESC(em)+"</a>":"-")+"</td>";
    h+="<td style='color:#64748B'>"+cy+"</td>";
    h+="<td><span style='background:#E0F2FE;color:#0284C7;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600'>"+sp+"</span></td>";
    h+="<td><span style='background:#DCFCE7;color:#16A34A;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600'>"+sr+"</span></td>";
    h+="<td style='max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#64748B'>"+ms+"</td>";
    h+="<td style='white-space:nowrap'>";
    h+="<button class=ab style='background:#E0F2FE;color:#0284C7' onclick='PR1(\""+id+"\")'>Print</button>";
    h+="<button class=ab style='background:#FEE2E2;color:#DC2626' onclick='D1(\""+id+"\")'>Delete</button>";
    h+="</td></tr>";
  }
  tb.innerHTML=h;
}
function TOG(id,chk){
  if(chk)SL.add(id);else SL.delete(id);
  var r=document.getElementById("R"+id);
  if(r)r.style.background=chk?"#EFF6FF":"";
  var b=document.getElementById("DSB");
  b.style.display=SL.size>0?"block":"none";
  b.textContent="Delete Selected ("+SL.size+")";
}
function SALL(chk){
  LD.forEach(function(l){
    if(chk)SL.add(l.id);else SL.delete(l.id);
    var r=document.getElementById("R"+l.id);
    if(r){r.style.background=chk?"#EFF6FF":"";var c=r.querySelector("input[type=checkbox]");if(c)c.checked=chk;}
  });
  var b=document.getElementById("DSB");
  b.style.display=chk&&SL.size>0?"block":"none";
  if(chk)b.textContent="Delete Selected ("+SL.size+")";
}
function D1(id){
  if(!confirm("Delete this lead?"))return;
  fetch(SB+"/rest/v1/sportspicks_leads?id=eq."+id,{method:"DELETE",headers:{"apikey":SK,"Authorization":"Bearer "+SK}})
  .then(function(){LD=LD.filter(function(l){return l.id!==id;});SL.delete(id);STAT();REND();});
}
function DSEL(){
  if(!SL.size)return;
  if(!confirm("Delete "+SL.size+" leads?"))return;
  var ids=Array.from(SL).join(",");
  fetch(SB+"/rest/v1/sportspicks_leads?id=in.("+ids+")",{method:"DELETE",headers:{"apikey":SK,"Authorization":"Bearer "+SK}})
  .then(function(){
    LD=LD.filter(function(l){return!SL.has(l.id);});
    SL.clear();
    document.getElementById("DSB").style.display="none";
    document.getElementById("CA").checked=false;
    STAT();REND();
  });
}
function PR1(id){
  var l=LD.find(function(x){return x.id===id;});
  if(!l)return;
  var w=window.open("","_blank");
  w.document.write("<html><head><title>Lead</title><style>body{font-family:Arial;padding:30px;font-size:13px}table{border-collapse:collapse;width:100%}td{padding:10px;border-bottom:1px solid #eee}td:first-child{font-weight:bold;color:#666;width:130px}</style></head><body>");
  w.document.write("<h2 style=color:#0EA5E9>FreeSportsPicks.pro Lead</h2><p>"+new Date().toLocaleString()+"</p><table>");
  var rows=[["Date",new Date(l.created_at).toLocaleString()],["Name",l.name||"-"],["Email",l.email||"-"],["City",l.city||"-"],["Sport",l.favorite_sport||"-"],["Source",l.source||"-"],["Message",l.message||"-"]];
  rows.forEach(function(r){w.document.write("<tr><td>"+r[0]+"</td><td>"+r[1]+"</td></tr>");});
  w.document.write("</table></body></html>");
  w.document.close();setTimeout(function(){w.print();},400);
}
function PALL(){
  var list=SL.size>0?LD.filter(function(l){return SL.has(l.id);}):LD;
  var w=window.open("","_blank");
  w.document.write("<html><head><title>FSP Leads</title><style>body{font-family:Arial;font-size:11px;padding:20px}h1{font-size:16px;color:#0EA5E9}table{width:100%;border-collapse:collapse}th{background:#0EA5E9;color:#fff;padding:7px;text-align:left;font-size:10px}td{padding:7px;border-bottom:1px solid #eee;font-size:10px}tr:nth-child(even){background:#f9f9f9}</style></head><body>");
  w.document.write("<h1>FreeSportsPicks.pro Leads</h1><p>"+new Date().toLocaleString()+" - "+list.length+" leads</p>");
  w.document.write("<table><thead><tr><th>#</th><th>Date</th><th>Name</th><th>Email</th><th>City</th><th>Sport</th><th>Source</th><th>Message</th></tr></thead><tbody>");
  list.forEach(function(l,i){w.document.write("<tr><td>"+(i+1)+"</td><td>"+new Date(l.created_at).toLocaleDateString()+"</td><td>"+(l.name||"-")+"</td><td>"+(l.email||"-")+"</td><td>"+(l.city||"-")+"</td><td>"+(l.favorite_sport||"-")+"</td><td>"+(l.source||"-")+"</td><td>"+(l.message||"-")+"</td></tr>");});
  w.document.write("</tbody></table></body></html>");
  w.document.close();setTimeout(function(){w.print();},400);
}
</script>
</body>
</html>
