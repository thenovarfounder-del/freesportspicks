<svg xmlns="http://www.w3.org/2000/svg" width="330" height="90" viewBox="0 0 330 90">
<defs>
  <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#E8C97A"/>
    <stop offset="50%" stop-color="#C9A84C"/>
    <stop offset="100%" stop-color="#7A5C0A"/>
  </linearGradient>
  <linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#DA8A3D"/>
    <stop offset="100%" stop-color="#7A3D0A"/>
  </linearGradient>
</defs>
<!-- Crown -->
<polygon points="38,6 33,16 27,10 30,19 38,16 46,19 50,10 43,16" fill="url(#lg1)" opacity="0.95"/>
<circle cx="38" cy="5" r="2.5" fill="#E8C97A"/>
<circle cx="27" cy="10" r="1.8" fill="#C9A84C"/>
<circle cx="50" cy="10" r="1.8" fill="#C9A84C"/>
<!-- FSP Letters -->
<text x="5" y="75" font-family="Georgia,serif" font-size="72" font-weight="700" fill="url(#lg1)">F</text>
<text x="54" y="78" font-family="Georgia,serif" font-size="78" font-weight="700" fill="url(#lg2)">S</text>
<text x="108" y="75" font-family="Georgia,serif" font-size="72" font-weight="700" fill="url(#lg1)">P</text>
<!-- Vertical divider -->
<line x1="168" y1="12" x2="168" y2="82" stroke="#C9A84C" stroke-width="1" opacity="0.4"/>
<!-- Line 1: FreeSportsPicks.pro -->
<text x="180" y="38" font-family="Palatino Linotype,Palatino,Georgia,serif" font-size="17" font-weight="700" fill="#C9A84C" letter-spacing="1">FreeSportsPicks.pro</text>
<!-- Thin gold rule -->
<line x1="180" y1="48" x2="328" y2="48" stroke="#C9A84C" stroke-width="0.6" opacity="0.5"/>
<!-- Line 2: Motto in copper italic -->
<text x="180" y="64" font-family="Palatino Linotype,Palatino,Georgia,serif" font-size="13" font-style="italic" fill="#C9A84C" opacity="0.8" letter-spacing="0.5">The Edge. The Analysis. The Win.</text>
<!-- Line 3: Tagline small gold -->
<text x="180" y="80" font-family="Arial,sans-serif" font-size="9" fill="#C9A84C" opacity="0.5" letter-spacing="3">PROFESSIONAL HANDICAPPING</text>
</svg>