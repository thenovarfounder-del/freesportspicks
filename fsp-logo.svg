<svg xmlns="http://www.w3.org/2000/svg" width="280" height="80" viewBox="0 0 280 80">
<defs>
  <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#E8C97A"/>
    <stop offset="50%" stop-color="#C9A84C"/>
    <stop offset="100%" stop-color="#7A5C0A"/>
  </linearGradient>
  <linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#DA8A3D"/>
    <stop offset="100%" stop-color="#7A3D0A"/>
  </linearGradient>
</defs>
<!-- Crown centered over FSP -->
<polygon points="72,2 67,10 61,6 63,13 72,10 81,13 83,6 77,10" fill="url(#lg1)" opacity="0.95"/>
<circle cx="72" cy="2" r="2" fill="#E8C97A"/>
<circle cx="61" cy="6" r="1.5" fill="#C9A84C"/>
<circle cx="83" cy="6" r="1.5" fill="#C9A84C"/>
<!-- FSP Letters -->
<text x="18" y="58" font-family="Georgia,serif" font-size="58" font-weight="700" fill="url(#lg1)">F</text>
<text x="55" y="61" font-family="Georgia,serif" font-size="64" font-weight="700" fill="url(#lg2)">S</text>
<text x="96" y="58" font-family="Georgia,serif" font-size="58" font-weight="700" fill="url(#lg1)">P</text>
<!-- Thin line under FSP -->
<line x1="18" y1="65" x2="144" y2="65" stroke="#C9A84C" stroke-width="0.6" opacity="0.4"/>
<polygon points="81,62 85,65 81,68 77,65" fill="#DA8A3D"/>
<!-- Motto -->
<text x="81" y="77" font-family="Georgia,serif" font-size="9" font-style="italic" fill="#DA8A3D" text-anchor="middle" letter-spacing="0.5">The Edge. The Analysis. The Win.</text>
</svg>